# Lokal utvikling. Produksjons-compose ligger i Docker-repoet:
# DMZ-DOCKER01/marlin/compose.yml
services:
  marlin:
    build: .
    image: marlin-check:dev
    ports:
      - "8000:8000"
    volumes:
      - ./dev-data:/data
      # Lokal dev: kopier requirements.example.yaml -> dev-config/requirements.yaml
      # og lag dev-config/admin_users.yaml (se admin_users.example.yaml) for /admin
      - ./dev-config:/config
    environment:
      TZ: Europe/Oslo
