# Marlin requirements: minimum levels per ECU and software profile.
#
# Sources (in the association's "V2 WIP ECU COMPARISON FOR MARLIN" workbook,
# received 2026-08-30):
#   - "Addl Source 1" (Jens Guthe, Sep 2026): the corrected minimum table with
#     three columns (2.0 / 2.1 / 2.2). NOTE: the earlier web-meeting screenshot
#     had its columns shifted — its "2.0/2.1" were actually these 2.1/2.2.
#   - The MAIN sheet: full OLP reference reports per OS version, which confirm
#     the numbers independently and reveal trim/region VARIANTS.
#
# Model:
#   - A car is "100% 2.1" when ALL of the modules below reach at least the
#     2.1 level. It can then be updated directly to Marlin
#     (target_profile: "2.1").
#   - Otherwise the car is a "zebra" and must first go via SW 2.2 / targeted
#     module updates.
#
# The number being compared is extracted from the report field
# "Supplier SW Version" using `extract` (regex, capture group 1).
#
# Variants: some ECUs have legitimate parallel software lines. `variants` picks
# the first entry whose `pattern` matches the value and uses its own
# extract/levels (e.g. BMS: BMSN* = NMC pack in One/Extreme/Ultra,
# BMSL* = LFP pack in Sport).
#
# Trims: the 5th VIN character encodes the trim (Z/E/U/S = One/Extreme/Ultra/
# Sport). `only_trims` limits a requirement to those trims — the single-motor
# Sport has no rear motor controller, so MCU_R is only required for Z/E/U.
#
# Already on Marlin: `marlin_level` on a module marks the level that only
# Marlin installs (VCU 24 = "VCU 2.4"). When every marked module reaches it,
# the verdict is "already on Marlin" instead of ready/zebra, and the result
# lists what Marlin left on older levels (Marlin does not update every ECU).
# Verified against two Marlin cars (Sep 2026): VCU 24, MCU 21, BMS 21, ESP 501,
# ECC 25, BCM 42 (one car had BCM 41 — open question).
#
# Sources and open points live in the `notes:` field below (not in comments):
# the admin form editor regenerates this file and drops comments, but keeps
# `notes` — so provenance survives a form save.
#
# In production this file is bind-mounted as /config/requirements.yaml and
# re-read on every analysis — edit it on the host or via /admin (no rebuild).

version: "2026-09-15"

notes: |
  Source: the association's "V2 WIP ECU COMPARISON FOR MARLIN" workbook (MAIN
  sheet with OLP reference reports per OS version; "Addl Source 1" minimum
  table by Jens; "Addl Source 2" expected-in-2.2 list by Edward), still marked
  draft by the association. Verified against real uploads on 2.1, 2.2 and
  Marlin (Sep 2026). ECC at 2.2 is 25 (the 2.2 reports and every full-2.2 car;
  Jens's table says 24). iBooster (IBS) is the eighth critical module since
  2026-09-13: ESP and iBooster must be on the same generation (400 on 2.1, 401
  on 2.2). Marlin installs four modules (VCU 24, PDU 4000, FCM PSOP09, HYDRA
  ADAS039051; workbook Marlin column, 7 of 9 Marlin cars); `marlin_modules` lists
  them so a Marlin car sees whether the whole package is in place. The version
  field is the date of the last change.

  Open points:
  - One Marlin car has BCM 41 where the table says 42 for 2.2.
  - The Sport/LFP BMS level (15) is read from one Sport reference report, not
    from a minimum table. The trim letter S (Sport, exempts MCU_R) has not been
    seen in a real upload; Z, E and U are verified.

  Right-hand drive: RHD-specific software lines exist only on EPS, AMP and
  HYDRA/ADAS, none of them required, so RHD cars need no special handling.
# Profiles in ascending order, and the profile required for direct Marlin.
# NOTE: the result-page texts in the portal (7 languages) are written for
# target "2.1" and highest profile "2.2". The rule engine is generic, but if
# these names ever change, the texts in app/locales/*.json must be rewritten
# too; /admin shows a warning when the file deviates.
profiles: ["2.0", "2.1", "2.2"]
target_profile: "2.1"

modules:
  - id: BCM
    label: Body Control Module
    match: [BCM]
    extract: 'BCM\d{3}0*(\d+)$'     # BCM395030 -> 30
    levels: {"2.0": 30, "2.1": 30, "2.2": 42}
    critical: true

  - id: ESP
    label: Electronic Stability Program
    match: [ESP]
    extract: 'V0*(\d{3})'           # 89324V040100960131 -> 401; 89819V0501... -> 501
    levels: {"2.0": 401, "2.1": 401, "2.2": 501}
    critical: true

  - id: IBS
    label: iBooster
    match: [IBS]
    extract: 'V0*(\d{3})'           # 88211V040000420131 -> 400 (2.1); 88211V040100430131 -> 401 (2.2)
    levels: {"2.0": 400, "2.1": 400, "2.2": 401}
    critical: true

  - id: ECC
    label: Electrical Climate Controller
    match: [ECC]
    extract: 'ECC395\s*0*(\d+)$'    # both "ECC395 24" and "ECC39519" forms
    levels: {"2.0": 19, "2.1": 24, "2.2": 25}
    critical: true

  - id: BMS
    label: Battery Management System
    match: [BMS]
    critical: true
    variants:
      - name: NMC (One/Extreme/Ultra)
        pattern: '^BMSN'
        extract: 'BMSN\d{3}0*(\d+)$'   # BMSN39021 -> 21
        levels: {"2.0": 21, "2.1": 21, "2.2": 21}
      - name: LFP (Sport)
        pattern: '^BMSL'
        extract: 'BMSL\d{3}0*(\d+)$'   # BMSL39015 -> 15
        levels: {"2.0": 15, "2.1": 15, "2.2": 15}

  - id: MCU_R
    label: Motor Control Unit Rear
    match: [MCU_R, MCU_RR]          # the report uses MCU_R, the tables MCU_RR
    extract: 'MCU\d{5}0*(\d+)$'     # MCU5000019 -> 19
    levels: {"2.0": 17, "2.1": 19, "2.2": 21}
    critical: true
    only_trims: [Z, E, U]           # the single-motor Sport has no rear MCU

  - id: MCU_F
    label: Motor Control Unit Front
    match: [MCU_F, MCU_FR]
    extract: 'MCU\d{5}0*(\d+)$'
    levels: {"2.0": 17, "2.1": 19, "2.2": 21}
    critical: true

  - id: VCU
    label: Vehicle Control Unit
    match: [VCU]
    extract: 'VCU\d{3}0*(\d+)$'     # VCU039021 -> 21
    levels: {"2.0": 20, "2.1": 21, "2.2": 23}
    critical: true
    marlin_level: 24                # VCU039024 = "VCU 2.4": the car already runs Marlin

# Modules that the Marlin update installs, and the level Marlin gives them.
# Only used to tell a car that is already on Marlin whether the whole Marlin
# package is in place; never part of the outcome. Source: the workbook's
# Marlin column and 7 of the 9 Marlin cars in the register (2026-09-15).
marlin_modules:
  - id: VCU
    label: Vehicle Control Unit
    match: [VCU]
    extract: 'VCU\d{3}0*(\d+)$'     # VCU039024 -> 24
    marlin_level: 24
  - id: PDU
    label: Power Distribution Unit
    match: [PDU]
    extract: 'PDU(\d{4})'          # PDU3900D02 -> 3900 (2.2); PDU4000D02 -> 4000 (Marlin)
    marlin_level: 4000
  - id: FCM
    label: Front Camera Module
    match: [FCM]
    extract: 'FCM[A-Z]{4}(\d+)'    # FCMSORP0E -> 0 (2.2); FCMPSOP09 -> 9 (Marlin)
    marlin_level: 9
  - id: HYDRA
    label: Advanced Driver Assist System
    match: [HYDRA]
    extract: 'ADAS039(\d+)$'       # ADAS039017 -> 17 (2.2); ADAS039051 -> 51 (Marlin)
    marlin_level: 51
