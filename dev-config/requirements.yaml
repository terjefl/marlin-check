# Marlin-krav: minimumsnivåer per ECU og programvareprofil.
#
# Kilde: foreningens tabell vist på videomøte 2026-08 («MINIMUM ECU
# requirements your car has to meet to have your 2.1 car be able to call it
# a 100% 2.1 — otherwise it is a Zebra»). UTKAST — tallene bekreftes når
# foreningen publiserer kravene offisielt.
#
# Modell:
#   - En bil er «100 % 2.1» når ALLE modulene under minst når 2.1-nivået.
#     Da kan den oppdateres direkte til Marlin (target_profile: "2.1").
#   - Ellers er bilen en «zebra» og må først via SW 2.2 / målrettede
#     moduloppdateringer. (Oppdatering via 2.2 løfter iflg. møtet også
#     ECC, ESP, PVIU og iBooster.)
#
# Tallet som sammenlignes trekkes ut av rapportfeltet «Supplier SW Version»
# med `extract` (regex, capture-gruppe 1) — feltet har ulik form per
# leverandør, f.eks. BCM395021, «ECC395 24», MCU5000019, 89324V040200990131.
#
# ANTAKELSER SOM MÅ BEKREFTES MOT FORENINGEN (merket [?] under):
#   - BCM: tabellkrav 30/42 mot «BCM395021» — vi antar suffikset (21) er
#     nivået, samme mønster som BMS/VCU. Gir BCM=21 < 30, dvs. under 2.0!
#   - ESP: tabellkrav 400/500 mot «89324V040200990131» — vi antar de fire
#     sifrene etter V er nivået (0402 -> 402).
#
# I produksjon bind-mountes denne som /config/requirements.yaml og leses på
# nytt ved hver analyse — kan redigeres på hosten uten rebuild.

version: "2026-08-videomote-utkast"

# Profiler i stigende rekkefølge, og profilen som kreves for direkte Marlin
profiles: ["2.0", "2.1"]
target_profile: "2.1"

modules:
  - id: BCM
    label: Body Control Module
    match: [BCM]
    extract: 'BCM\d{3}0*(\d+)$'     # BCM395021 -> 21  [?]
    levels: {"2.0": 30, "2.1": 42}
    critical: true

  - id: ESP
    label: Electronic Stability Program
    match: [ESP]
    extract: 'V0*(\d{3})'           # 89324V040200990131 -> 402  [?]
    levels: {"2.0": 400, "2.1": 500}
    critical: true

  - id: ECC
    label: Electrical Climate Controller
    match: [ECC]
    extract: '(\d+)\s*$'            # "ECC395 24" -> 24
    levels: {"2.0": 24, "2.1": 24}
    critical: true

  - id: BMS
    label: Battery Management System
    match: [BMS]
    extract: 'BMSN\d{3}0*(\d+)$'    # BMSN39021 -> 21
    levels: {"2.0": 19, "2.1": 21}
    critical: true

  - id: MCU_R
    label: Motor Control Unit Rear
    match: [MCU_R, MCU_RR]          # rapporten bruker MCU_R, møtetabellen MCU_RR
    extract: 'MCU\d{5}0*(\d+)$'     # MCU5000019 -> 19
    levels: {"2.0": 19, "2.1": 21}
    critical: true

  - id: MCU_F
    label: Motor Control Unit Front
    match: [MCU_F, MCU_FR]
    extract: 'MCU\d{5}0*(\d+)$'
    levels: {"2.0": 19, "2.1": 21}
    critical: true

  - id: VCU
    label: Vehicle Control Unit
    match: [VCU]
    extract: 'VCU\d{3}0*(\d+)$'     # VCU039021 -> 21
    levels: {"2.0": 21, "2.1": 23}
    critical: true
